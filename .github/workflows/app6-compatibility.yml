name: App 6 compatibility

on:
  push:
    branches:
      - refactor/app-runtime-contracts
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: componenta/app
          ref: refactor/app-runtime-contracts
          path: app-source
      - uses: actions/checkout@v7
        with:
          repository: componenta/app-console
          ref: refactor/app-runtime-contracts
          path: console-source
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo_sqlite
          coverage: none
          tools: composer:v2
      - run: >-
          composer config repositories.app
          '{"type":"path","url":"app-source","options":{"symlink":false,"versions":{"componenta/app":"6.0.0"}}}'
      - run: >-
          composer config repositories.app-console
          '{"type":"path","url":"console-source","options":{"symlink":false,"versions":{"componenta/app-console":"6.0.0"}}}'
      - run: composer validate --strict
      - run: composer update --no-interaction --prefer-dist
      - run: composer show componenta/app
      - run: composer show componenta/app-console
      - run: composer test
