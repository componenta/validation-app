name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: componenta/validation
          ref: v2
          path: validation-source
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
      - run: composer config --working-dir=validation-source version 2.0.0
      - run: composer config repositories.validation path validation-source
      - run: composer validate --strict
      - run: composer update --no-interaction --prefer-dist
      - run: composer test
